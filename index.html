<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식모아 - 전국 학교 급식 조회</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
            --primary-light: #ccfbf1;
            --accent-color: #f59e0b;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 헤더 스타일 */
        header {
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            color: white;
            padding: 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Gothic A1', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.95;
            font-weight: 500;
        }

        /* 검색 카드 */
        .search-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            background-color: #fff;
            font-weight: 500;
        }

        input[type="date"] {
            padding-left: 14px;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        .search-btn {
            padding: 0 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        /* 학교 검색 결과 선택 리스트 */
        .school-results {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
            display: none;
        }

        .school-item {
            padding: 10px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .school-item:hover {
            background-color: var(--primary-light);
            color: var(--primary-hover);
            font-weight: 700;
        }

        .school-item .region {
            font-size: 0.75rem;
            color: var(--text-sub);
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 날짜 탐색 바 */
        .quick-date-btns {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .quick-btn {
            flex: 1;
            padding: 8px 0;
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .quick-btn:hover {
            background-color: #e2e8f0;
        }

        .quick-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 주간 급식 슬라이드 탭 */
        .week-strip {
            display: flex;
            justify-content: space-between;
            background-color: #f8fafc;
            padding: 8px;
            border-radius: 14px;
            gap: 4px;
        }

        .day-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-tab .day-name {
            font-size: 0.7rem;
            color: var(--text-sub);
            font-weight: 700;
        }

        .day-tab .day-num {
            font-size: 0.85rem;
            font-weight: 800;
            margin-top: 2px;
        }

        .day-tab.active {
            background-color: var(--primary-color);
            color: white;
        }

        .day-tab.active .day-name {
            color: #e6fffa;
        }

        /* 급식 메인 카드 */
        .meal-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 12px;
        }

        .meal-date-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-arrow-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--primary-color);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .date-arrow-btn:hover {
            background-color: var(--primary-light);
        }

        .meal-date {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .badge {
            background-color: #fef3c7;
            color: #d97706;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: #f8fafc;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .menu-name {
            font-weight: 500;
        }

        .allergy-icons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 130px;
        }

        .allergy-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.7rem;
            color: white;
            cursor: pointer;
        }

        /* 알레르기 아이콘 색상 */
        .bg-milk { background-color: #f59e0b; }
        .bg-egg { background-color: #eab308; }
        .bg-pork { background-color: #ef4444; }
        .bg-wheat { background-color: #84cc16; }
        .bg-soy { background-color: #10b981; }
        .bg-nuts { background-color: #b45309; }
        .bg-default { background-color: #64748b; }

        /* 급식 평가 영역 */
        .reaction-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px;
            background-color: #f8fafc;
            border-radius: 12px;
            margin-top: 4px;
        }

        .reaction-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .reaction-btn.active-like {
            background-color: #fef2f2;
            color: #ef4444;
            border-color: #fca5a5;
        }

        .reaction-btn.active-dislike {
            background-color: #f0f9ff;
            color: #0284c7;
            border-color: #7dd3fc;
        }

        .nutrition-info {
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .nutrition-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nutrition-item .label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .nutrition-item .value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* 알레르기 범례 카드 */
        .legend-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .legend-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-main);
        }

        .no-data {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-sub);
        }

        .no-data i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .info-box {
            background-color: #f0fdf4;
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #0f766e;
        }

        .loading-spinner {
            text-align: center;
            padding: 30px;
            color: var(--primary-color);
        }

        .loading-spinner i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 헤더 -->
        <header>
            <h1><i class="fa-solid fa-bowl-rice"></i> 급식모아 (전국 학교)</h1>
            <p>전국의 모든 초·중·고등학교 급식을 실시간으로 조회하세요!</p>
        </header>

        <!-- 학교 및 날짜 선택 -->
        <section class="search-card">
            <div class="input-group">
                <label for="schoolInput"><i class="fa-solid fa-school"></i> 전국 학교 검색</label>
                <div class="search-box">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="schoolInput" placeholder="학교 이름 입력 (예: 역삼중, 부산고)" value="역삼중학교" autocomplete="off">
                    </div>
                    <button class="search-btn" onclick="searchSchool()"><i class="fa-solid fa-search"></i> 검색</button>
                </div>
                <!-- 학교 검색 결과 리스트 -->
                <div class="school-results" id="schoolResults"></div>
            </div>

            <!-- 날짜 선택 캘린더 및 단축 버튼 -->
            <div class="input-group">
                <label for="dateInput"><i class="fa-regular fa-calendar-check"></i> 날짜 직접 선택</label>
                <input type="date" id="dateInput">
            </div>

            <!-- 빠른 이동 버튼 -->
            <div class="quick-date-btns">
                <button class="quick-btn" onclick="setDateOffset(-1)"><i class="fa-solid fa-angle-left"></i> 어제</button>
                <button class="quick-btn active" id="btnToday" onclick="setToday()"><i class="fa-solid fa-star"></i> 오늘</button>
                <button class="quick-btn" onclick="setDateOffset(1)">내일 <i class="fa-solid fa-angle-right"></i></button>
            </div>

            <!-- 주간 날짜 선택 스크롤 탭 -->
            <div class="week-strip" id="weekStrip"></div>
        </section>

        <!-- 급식 표시 카드 -->
        <main class="meal-card" id="mealCard"></main>

        <!-- 알레르기 안내 -->
        <section class="legend-card">
            <div class="legend-title">알레르기 정보 기호 안내</div>
            <div class="legend-grid">
                <div class="legend-item"><span class="allergy-icon bg-milk"><i class="fa-solid fa-glass-water"></i></span> 우유(2)</div>
                <div class="legend-item"><span class="allergy-icon bg-egg"><i class="fa-solid fa-egg"></i></span> 난류(1)</div>
                <div class="legend-item"><span class="allergy-icon bg-pork"><i class="fa-solid fa-drumstick-bite"></i></span> 돼지고기(10)</div>
                <div class="legend-item"><span class="allergy-icon bg-wheat"><i class="fa-solid fa-wheat-awn"></i></span> 밀(6)</div>
                <div class="legend-item"><span class="allergy-icon bg-soy"><i class="fa-solid fa-seedling"></i></span> 대두(5)</div>
                <div class="legend-item"><span class="allergy-icon bg-nuts"><i class="fa-solid fa-box-archive"></i></span> 땅콩/견과(4,14)</div>
            </div>
        </section>

        <div class="info-box">
            <i class="fa-solid fa-bullhorn"></i> 교육부 <b>NEIS 공공 API</b> 연동으로 전국 모든 초·중·고 급식 정보를 실시간으로 불러옵니다.
        </div>
    </div>

    <script>
        // 알레르기 번호 매핑 (NEIS 기준: 1.난류, 2.우유, 3.메밀, 4.땅콩, 5.대두, 6.밀, 7.고등어, 8.게, 9.새우, 10.돼지고기, 11.복숭아, 12.토마토, 13.아황산류, 14.호두, 15.닭고기, 16.쇠고기, 17.오징어, 18.조개류)
        const allergyConfig = {
            "1": { icon: "fa-egg", bgClass: "bg-egg", label: "난류" },
            "2": { icon: "fa-glass-water", bgClass: "bg-milk", label: "우유" },
            "4": { icon: "fa-box-archive", bgClass: "bg-nuts", label: "땅콩" },
            "5": { icon: "fa-seedling", bgClass: "bg-soy", label: "대두" },
            "6": { icon: "fa-wheat-awn", bgClass: "bg-wheat", label: "밀" },
            "10": { icon: "fa-drumstick-bite", bgClass: "bg-pork", label: "돼지고기" },
            "14": { icon: "fa-box-archive", bgClass: "bg-nuts", label: "호두" }
        };

        // 선택된 학교 정보 (기본값: 역삼중학교)
        let selectedSchool = {
            ATPT_OFCDC_SC_CODE: "B10", // 서울특별시교육청
            SD_SCHUL_CODE: "7010536",
            SCHUL_NM: "역삼중학교"
        };

        const userReactions = {};

        const schoolInput = document.getElementById('schoolInput');
        const schoolResults = document.getElementById('schoolResults');
        const dateInput = document.getElementById('dateInput');
        const mealCard = document.getElementById('mealCard');
        const weekStrip = document.getElementById('weekStrip');

        // 오늘 날짜 구하기 (YYYY-MM-DD)
        const todayObj = new Date();
        const TODAY_DATE = formatDateString(todayObj);

        window.addEventListener('DOMContentLoaded', () => {
            dateInput.value = TODAY_DATE;
            
            // 엔터키로 검색 가능
            schoolInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchSchool();
            });

            dateInput.addEventListener('change', fetchMealData);
            
            // 기본 학교 급식 로드
            fetchMealData();
        });

        // 1. 전국 학교 검색 (나이스 오픈 API)
        async function searchSchool() {
            const query = schoolInput.value.trim();
            if (!query) return;

            schoolResults.style.display = 'block';
            schoolResults.innerHTML = `
                <div style="padding:10px; text-align:center; font-size:0.85rem; color:#64748b;">
                    <i class="fa-solid fa-spinner fa-spin"></i> 학교를 찾는 중입니다...
                </div>
            `;

            try {
                const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=10&SCHUL_NM=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.schoolInfo) {
                    const schools = data.schoolInfo[1].row;
                    let html = '';
                    schools.forEach(school => {
                        html += `
                            <div class="school-item" onclick="selectSchool('${school.ATPT_OFCDC_SC_CODE}', '${school.SD_SCHUL_CODE}', '${school.SCHUL_NM}')">
                                <span><i class="fa-solid fa-school"></i> <b>${school.SCHUL_NM}</b></span>
                                <span class="region">${school.LCTN_SC_NM || '지역'}</span>
                            </div>
                        `;
                    });
                    schoolResults.innerHTML = html;
                } else {
                    schoolResults.innerHTML = `<div style="padding:10px; text-align:center; font-size:0.85rem; color:#ef4444;">검색 결과가 없습니다.</div>`;
                }
            } catch (error) {
                console.error("학교 검색 오류:", error);
                schoolResults.innerHTML = `<div style="padding:10px; text-align:center; font-size:0.85rem; color:#ef4444;">학교 정보를 불러오는 중 오류가 발생했습니다.</div>`;
            }
        }

        // 2. 학교 선택시
        function selectSchool(officeCode, schoolCode, schoolName) {
            selectedSchool = {
                ATPT_OFCDC_SC_CODE: officeCode,
                SD_SCHUL_CODE: schoolCode,
                SCHUL_NM: schoolName
            };

            schoolInput.value = schoolName;
            schoolResults.style.display = 'none';
            fetchMealData();
        }

        // 3. 실시간 급식 정보 불러오기 (나이스 오픈 API)
        async function fetchMealData() {
            const selectedDate = dateInput.value;
            const yyyymmdd = selectedDate.replace(/-/g, '');

            renderWeekStrip(selectedDate);

            // 오늘 버튼 활성화 상태 표시
            const btnToday = document.getElementById('btnToday');
            if (selectedDate === TODAY_DATE) {
                btnToday.classList.add('active');
            } else {
                btnToday.classList.remove('active');
            }

            // 로딩 표시
            mealCard.innerHTML = `
                <div class="loading-spinner">
                    <i class="fa-solid fa-circle-notch"></i>
                    <p style="margin-top:10px; font-weight:700; font-size:0.9rem;">${selectedSchool.SCHUL_NM} 급식을 불러오는 중...</p>
                </div>
            `;

            try {
                const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=5&ATPT_OFCDC_SC_CODE=${selectedSchool.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${selectedSchool.SD_SCHUL_CODE}&MLSV_YMD=${yyyymmdd}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.mealServiceDietInfo) {
                    const mealRow = data.mealServiceDietInfo[1].row[0];
                    renderMealCard(mealRow, selectedDate);
                } else {
                    renderNoData(selectedDate);
                }
            } catch (error) {
                console.error("급식 정보 로드 오류:", error);
                renderNoData(selectedDate, "급식 정보를 가져오는 도중 네트워크 오류가 발생했습니다.");
            }
        }

        // 4. 급식 카드 출력
        function renderMealCard(mealRow, selectedDate) {
            // 요일 구하기
            const dateObj = new Date(selectedDate);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayOfWeek = days[dateObj.getDay()];

            // 메뉴 정제 (알레르기 번호 추출)
            const rawDDISH = mealRow.DDISH_NM || '';
            // 문자열 구분자로 분리 (br 태그 등)
            const items = rawDDISH.split('<br/>').map(itemStr => {
                const cleanName = itemStr.replace(/\([0-9\.]+\)/g, '').trim(); // 알레르기 숫자 제거된 이름
                
                // 알레르기 번호 추출
                const match = itemStr.match(/\(([0-9\.]+)\)/);
                const allergyNums = match ? match[1].split('.') : [];

                return {
                    name: cleanName,
                    allergies: allergyNums
                };
            }).filter(i => i.name.length > 0);

            let menuItemsHtml = '';
            items.forEach(item => {
                let allergyHtml = '';
                item.allergies.forEach(num => {
                    const config = allergyConfig[num];
                    if (config) {
                        allergyHtml += `
                            <span class="allergy-icon ${config.bgClass}" title="${config.label}">
                                <i class="fa-solid ${config.icon}"></i>
                            </span>
                        `;
                    } else if (num) {
                        allergyHtml += `
                            <span class="allergy-icon bg-default" title="알레르기 ${num}번">
                                ${num}
                            </span>
                        `;
                    }
                });

                menuItemsHtml += `
                    <li class="menu-item">
                        <span class="menu-name">${item.name}</span>
                        <div class="allergy-icons">${allergyHtml}</div>
                    </li>
                `;
            });

            const key = `${selectedSchool.SD_SCHUL_CODE}_${selectedDate}`;
            const currentReaction = userReactions[key] || { like: false, dislike: false };

            const calInfo = mealRow.CAL_INFO || '정보 없음';

            mealCard.innerHTML = `
                <div class="meal-header">
                    <div class="meal-date-nav">
                        <button class="date-arrow-btn" onclick="setDateOffset(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="meal-date">${selectedDate} (${dayOfWeek})</span>
                        <button class="date-arrow-btn" onclick="setDateOffset(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <span class="badge" title="${selectedSchool.SCHUL_NM}">${selectedSchool.SCHUL_NM}</span>
                </div>
                <ul class="menu-list">
                    ${menuItemsHtml}
                </ul>
                <div class="reaction-section">
                    <button class="reaction-btn ${currentReaction.like ? 'active-like' : ''}" onclick="toggleReaction('like')">
                        <i class="fa-solid fa-thumbs-up"></i> 최고예요
                    </button>
                    <button class="reaction-btn ${currentReaction.dislike ? 'active-dislike' : ''}" onclick="toggleReaction('dislike')">
                        <i class="fa-solid fa-thumbs-down"></i> 아쉬워요
                    </button>
                </div>
                <div class="nutrition-info">
                    <div class="nutrition-item">
                        <span class="label">열량</span>
                        <span class="value">${calInfo}</span>
                    </div>
                    <div class="nutrition-item">
                        <span class="label">급식 인원</span>
                        <span class="value">${mealRow.NTR_INFO ? '영양정보 등록' : '정상 등록'}</span>
                    </div>
                </div>
            `;
        }

        // 데이터 없을 때
        function renderNoData(selectedDate, customMsg) {
            mealCard.innerHTML = `
                <div class="no-data">
                    <i class="fa-regular fa-face-frown"></i>
                    <p><b>${selectedSchool.SCHUL_NM}</b>의<br>${selectedDate} 급식 정보가 없습니다.</p>
                    <span style="font-size:0.8rem; color:#94a3b8; display:block; margin-top:8px;">
                        ${customMsg || '(주말, 방학 또는 학교 급식 미운영일일 수 있습니다.)'}
                    </span>
                </div>
            `;
        }

        function setToday() {
            dateInput.value = TODAY_DATE;
            fetchMealData();
        }

        function setDateOffset(offset) {
            const current = new Date(dateInput.value || TODAY_DATE);
            current.setDate(current.getDate() + offset);
            dateInput.value = formatDateString(current);
            fetchMealData();
        }

        function formatDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function toggleReaction(type) {
            const selectedDate = dateInput.value;
            const key = `${selectedSchool.SD_SCHUL_CODE}_${selectedDate}`;

            if (!userReactions[key]) {
                userReactions[key] = { like: false, dislike: false };
            }

            if (type === 'like') {
                userReactions[key].like = !userReactions[key].like;
                if (userReactions[key].like) userReactions[key].dislike = false;
            } else {
                userReactions[key].dislike = !userReactions[key].dislike;
                if (userReactions[key].dislike) userReactions[key].like = false;
            }

            fetchMealData();
        }

        function renderWeekStrip(currentDateStr) {
            const curr = new Date(currentDateStr);
            const dayOfWeek = curr.getDay();
            const distanceToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(curr);
            monday.setDate(curr.getDate() + distanceToMon);

            const dayNames = ['월', '화', '수', '목', '금'];
            let stripHtml = '';

            for (let i = 0; i < 5; i++) {
                const targetDay = new Date(monday);
                targetDay.setDate(monday.getDate() + i);
                const targetStr = formatDateString(targetDay);
                const isActive = targetStr === currentDateStr ? 'active' : '';

                stripHtml += `
                    <div class="day-tab ${isActive}" onclick="setDateDirect('${targetStr}')">
                        <span class="day-name">${dayNames[i]}</span>
                        <span class="day-num">${targetDay.getDate()}</span>
                    </div>
                `;
            }

            weekStrip.innerHTML = stripHtml;
        }

        function setDateDirect(dateStr) {
            dateInput.value = dateStr;
            fetchMealData();
        }
    </script>
</body>
</html>
